<title>楽譜番号検索</title>
<style>
:root{color-scheme:light;--ink:#111;--line:#dedede;--muted:#666;--paper:#fff;--soft:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{border-bottom:2px solid var(--ink);padding:0 0 18px;margin-bottom:24px}
h1{font-size:clamp(24px,5vw,34px);letter-spacing:.02em;margin:0 0 6px;font-weight:750}
.sub{font-size:13px;color:var(--muted);margin:0}
.search{display:flex;gap:8px;margin:18px 0 12px}
input,button{font:inherit;border-radius:8px}
input{min-width:0;width:100%;padding:13px 14px;border:1px solid #aaa;background:#fff;color:#111}
button{padding:12px 16px;border:1px solid var(--ink);background:var(--ink);color:white;cursor:pointer;font-weight:650}
button.secondary{background:white;color:var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid #888;outline-offset:2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:13px}
.results{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px 15px;display:flex;align-items:center;gap:14px}
.num{font-size:22px;font-weight:800;min-width:52px;font-variant-numeric:tabular-nums}
.name{flex:1;line-height:1.45;overflow-wrap:anywhere}
.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:7px 9px}
.empty{padding:26px 16px;text-align:center;border:1px dashed #bbb;border-radius:10px;color:var(--muted)}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
summary{cursor:pointer;font-weight:700}
.formgrid{display:grid;grid-template-columns:100px 1fr;gap:10px;margin-top:16px}
.formgrid label{font-size:13px;align-self:center;color:var(--muted)}
.formgrid input{padding:11px}
.formactions{display:flex;gap:8px;margin-top:12px}
.note{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:480px){main{padding:22px 14px 44px}.search button{padding:12px}.item{padding:12px}.num{min-width:44px}.actions button{padding:7px}.toolbar{align-items:flex-start}}
</style>
</head>
<body>
<main>
<header><h1>楽譜番号検索</h1><p class="sub">曲名・キーワードから楽譜を探す</p></header>
<div class="search"><input id="query" aria-label="検索キーワード" placeholder="例：ハウル、ディズニー、210" autocomplete="off"><button id="searchBtn">検索</button></div>
<div class="toolbar"><span id="count">登録曲 0 件</span><button class="secondary" id="clearBtn">検索をクリア</button></div>
<section id="results" class="results" aria-live="polite"></section>
<details>
<summary>楽譜を追加・編集</summary>
<form id="entryForm">
<div class="formgrid">
<label for="number">番号</label><input id="number" type="number" min="1" required placeholder="例：288">
<label for="title">曲名</label><input id="title" required placeholder="例：新しい曲名">
<label for="keywords">キーワード</label><input id="keywords" placeholder="任意・読点やカンマで区切る">
</div>
<div class="formactions"><button type="submit" id="saveBtn">追加する</button><button type="button" class="secondary" id="cancelBtn" hidden>編集をやめる</button></div>
</form>
</details>
<p class="note">この試作版の変更内容は、現在使用しているブラウザ内に保存されます。部員全員で同じデータを共有する公開版には、共有データベースとホスティングの設定が必要です。</p>
</main>

const storedVersion=localStorage.getItem("scoreSongsVersion");
let songs=storedVersion===DATA_VERSION ? (JSON.parse(localStorage.getItem("scoreSongs")||"null")||initial) : initial;
let editId=null;
const $=id=>document.getElementById(id);
function norm(s){return String(s??"").toLowerCase().normalize("NFKC").replace(/[・･\s\-‐‑–—／/]/g,"")}
function save(){localStorage.setItem("scoreSongs",JSON.stringify(songs));localStorage.setItem("scoreSongsVersion",DATA_VERSION)}
function render(){
 const q=norm($("query").value);
 const rows=songs.filter(s=>!q||norm(s.number).includes(q)||norm(s.title).includes(q)||norm(s.keywords).includes(q))
 .sort((a,b)=>a.number-b.number);
 $("count").textContent=`登録曲 ${songs.length} 件　／　検索結果 ${rows.length} 件`;
 $("results").innerHTML=rows.length?rows.map(s=>`<article class="item"><div class="num">${s.number}</div><div class="name">${escapeHtml(s.title)}</div><div class="actions"><button class="secondary" data-edit="${s.id}" aria-label="編集">編集</button><button class="secondary" data-del="${s.id}" aria-label="削除">削除</button></div></article>`).join(""):`<div class="empty">該当する楽譜がありません</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
songs=songs.map((s,i)=>({...s,id:s.id||`${s.number}-${i}`}));save();render();
$("searchBtn").onclick=render;$("query").addEventListener("input",render);
$("clearBtn").onclick=()=>{$("query").value="";render()};
$("results").addEventListener("click",e=>{
 const ed=e.target.dataset.edit,del=e.target.dataset.del;
 if(ed){const s=songs.find(x=>x.id===ed);if(!s)return;editId=ed;$("number").value=s.number;$("title").value=s.title;$("keywords").value=s.keywords||"";$("saveBtn").textContent="変更を保存";$("cancelBtn").hidden=false;$("entryForm").parentElement.open=true;$("number").focus()}
 if(del&&confirm("この曲を削除しますか？")){songs=songs.filter(x=>x.id!==del);save();render()}
});
$("entryForm").onsubmit=e=>{e.preventDefault();const number=Number($("number").value),title=$("title").value.trim(),keywords=$("keywords").value.trim();if(!number||!title)return;
 if(editId){songs=songs.map(s=>s.id===editId?{...s,number,title,keywords}:s)}else{songs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),number,title,keywords})}
 save();render();resetForm();$("entryForm").parentElement.open=false};
function resetForm(){editId=null;$("entryForm").reset();$("saveBtn").textContent="追加する";$("cancelBtn").hidden=true}
$("cancelBtn").onclick=resetForm;
</script>
